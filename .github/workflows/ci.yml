# CI for quiz-ai.
#
# `verify` runs on every push/PR: the same four gates enforced locally —
# typecheck, eslint (errors only), the node:test unit suite, and a production
# build. It needs no secrets: Supabase clients are created lazily (see
# src/lib/supabase/admin.ts) and the browser client has fallbacks, so
# prerendering succeeds against placeholder values that are never used.
#
# `e2e` runs the real-stack suites (enrollment + identity verification, exam
# integrity, scheduled-maintenance sweep) against a local Supabase stack
# started on the runner, and is a full gate: it runs on every push and pull
# request alongside `verify`. The suites pass locally via `pnpm run test:e2e*`.
# If hosted-runner docker/CLI plumbing proves flaky, scope it back with
# `if: github.event_name == 'workflow_dispatch'` on the e2e job.
#
# Package manager: pnpm. The repository keeps exactly one lockfile,
# pnpm-lock.yaml; package-lock.json was removed so a host that auto-detects the
# manager from a lockfile cannot pick a different one than CI does. The version
# is pinned in this file rather than through `packageManager` in package.json,
# because pnpm 12 records that field as a dependency it manages itself and
# rewrites the lockfile to include @pnpm/exe platform binaries. Both jobs install
# pnpm before setup-node, because `cache: pnpm` resolves the store through pnpm
# itself, so pnpm has to be on PATH first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # eslint exits non-zero only on errors; the current warnings are
      # tracked separately and must not block the pipeline.
      - name: Lint
        run: pnpm run lint

      # Runs env-free (pnpm test does not load .env.local) — pure logic only.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
          SUPABASE_DB_URL: postgres://placeholder@localhost:54322/postgres

  e2e:
    name: E2E (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # T31-T33 call a real AI provider. With no key the server refuses the call
    # and those checks SKIP rather than fail (scripts/e2e-enrollment.mjs); add
    # the secrets to exercise them in CI. Job-wide because the suites spawn
    # `next start` with their own process.env, so the server needs them too.
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Also installs the pinned supabase CLI (devDependency), so the CLI
        # version matches what applied these migrations locally.
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        # Docker Hub / public.ecr.aws throttle anonymous pulls ("toomanyrequests:
        # Rate exceeded") on shared runners, which intermittently aborts the
        # stack bring-up before any migration runs. Layers pulled before the
        # throttle are cached, so a bounded retry clears it.
        run: |
          for attempt in 1 2 3; do
            if pnpm exec supabase start; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt $attempt) — retrying"
            pnpm exec supabase stop --no-backup >/dev/null 2>&1 || true
            sleep $((attempt * 15))
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      - name: Apply migrations to the local stack
        # Fails the job if any migration is not idempotent or breaks.
        run: pnpm exec supabase db reset

      - name: Read stack settings into .env.local
        id: sb
        run: |
          pnpm exec supabase status -o json > /tmp/supabase-status.json
          api_url=$(jq -r '.API_URL // .api_url // .API.URL // .Api.URL // empty' /tmp/supabase-status.json)
          anon_key=$(jq -r '.ANON_KEY // .anon_key // .API.ANON_KEY // .Api.anonKey // empty' /tmp/supabase-status.json)
          service_role_key=$(jq -r '.SERVICE_ROLE_KEY // .service_role_key // .API.SERVICE_ROLE_KEY // .Api.serviceRoleKey // empty' /tmp/supabase-status.json)
          if [ -z "$api_url" ] || [ -z "$anon_key" ] || [ -z "$service_role_key" ]; then
            echo "::error::Unrecognized 'supabase status' shape — update the jq keys:"
            cat /tmp/supabase-status.json
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
          } > .env.local
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"

      - name: Wait for the local stack to serve
        # `supabase start` can exit 0 while a container is still binding its
        # port; the suites then fail much later with a confusing connection
        # error. Probe the endpoints the app actually uses and retry briefly so
        # a half-ready stack fails here, with the status codes that explain it.
        env:
          API_URL: ${{ steps.sb.outputs.api_url }}
        run: |
          for attempt in $(seq 1 15); do
            rest_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$API_URL/rest/v1/" 2>/dev/null || true)
            auth_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$API_URL/auth/v1/health" 2>/dev/null || true)
            # Serving means the gateway answered (not 000), auth reports healthy,
            # and the REST gateway is not returning a 5xx upstream error.
            if [ -n "$rest_code" ] && [ "$rest_code" != "000" ] && [ "${rest_code#5}" = "$rest_code" ] && [ "$auth_code" = "200" ]; then
              echo "Local Supabase is serving at $API_URL (rest=$rest_code auth=$auth_code)"
              exit 0
            fi
            echo "::warning::local stack not ready (attempt $attempt): rest=$rest_code auth=$auth_code"
            sleep 2
          done
          echo "::error::Local Supabase API never became ready at $API_URL"
          exit 1

      # The e2e scripts spawn `next start` themselves and read .env.local,
      # exactly as they do when run locally (pnpm run test:e2e*).
      - name: Build
        run: pnpm run build

      - name: E2E — enrollment & identity verification
        run: pnpm run test:e2e

      - name: E2E — exam integrity
        run: pnpm run test:e2e:exam

      - name: E2E — scheduled maintenance sweep
        run: pnpm run test:e2e:sweep
